name: webflow_api
description: A Webflow CMS Dart package.
  Useful to manage the collections and items of a Webflow project.
  Could be used to create Flutter apps for managing websites' content.
version: 0.3.0

repository: https://github.com/InnoFlutter/webflow_api

environment:
  sdk: '>=2.17.6 <3.0.0'

dependencies:
  crypto: ^3.0.0
  http: ^1.0.0
  json_annotation:

dev_dependencies:
  build_runner:
  json_serializable:
  lints: ^2.0.0
  test: ^1.16.0
